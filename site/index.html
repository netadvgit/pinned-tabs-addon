<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Persistent Pinned Tabs</title>
<style>
  :root { --bg:#fff; --fg:#1b1b1f; --muted:#666; --accent:#0060df; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b22; --fg:#fbfbfe; --muted:#a0a0ab; --accent:#6ea8ff; } }
  body { font:16px/1.5 system-ui,sans-serif; background:var(--bg); color:var(--fg); max-width:34rem; margin:4rem auto; padding:0 1rem; }
  a.btn { display:inline-block; background:var(--accent); color:#fff; padding:.7rem 1.2rem; border-radius:6px; text-decoration:none; font-weight:600; }
  p.small { color:var(--muted); font-size:.9rem; }
</style>
</head>
<body>
  <h1>Persistent Pinned Tabs</h1>
  <p>Pinned tabs that survive restarts, follow you into every window and sync between browsers through your own Dropbox.</p>
  <p><a class="btn" href="latest.xpi">Install in Firefox</a></p>
  <p class="small">Open this page in the Firefox you want to install it in, click the button and choose Add. Updates install automatically.</p>
</body>
</html>
